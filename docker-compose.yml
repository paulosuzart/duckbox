services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: duckbox
      POSTGRES_PASSWORD: duckbox
      POSTGRES_DB: ducklake
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duckbox -d ducklake"]
      interval: 2s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional STS emulator. Started only with `--profile sts`.
  # Root user can AssumeRole for local temporary-credential tests.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":19001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION_NAME: us-east-1
    ports:
      - "19000:9000"
      - "19001:19001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles:
      - sts

volumes:
  rustfs_data:
  minio_data:
