name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin Arrow 26.0.0 (what CI installs today). DuckDB stays 2.0.0.
# Linux jobs run on ubuntu-24.04 so the Apache apt-source SHA256 pin stays valid.
env:
  ARROW_VERSION: "26.0.0"
  ARROW_APT_VERSION: "26.0.0-1"

jobs:
  enforcement:
    name: Build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Arrow Flight SQL + build tools
        run: bash scripts/install_arrow.sh
      - name: Cache DuckDB deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .deps
            ~/.duckdb
          key: duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-sts-id-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
            duckdb-v2.0.0-nanoarrow-yamlcpp080-nlohmann3113-awssdk-s3-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
            duckdb-v2.0.0-nanoarrow-yamlcpp080-nlohmann3113-awssdk-s3-${{ runner.os }}-${{ runner.arch }}
      - name: Install AWS SDK C++ (S3+STS, vcpkg)
        run: bash scripts/install_aws_sdk.sh
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          create-symlink: true
          max-size: 500M
      - name: Build
        run: make build CXX=g++
      - name: pyarrow (Flight SQL metadata alignment)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r examples/python/requirements.txt
      - name: Unit tests
        env:
          DUCKBOX_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: ctest --test-dir build -L unit --output-on-failure
      - name: Guardrail tests
        run: ctest --test-dir build -L guardrails --output-on-failure
      - name: Integration tests
        run: ctest --test-dir build -L integration --output-on-failure
      - name: Validate memory spec
        run: make validate

  macos-arm64:
    name: macOS arm64 (build + unit)
    runs-on: macos-latest
    timeout-minutes: 50
    env:
      DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require Apple Silicon
        run: test "$(uname -m)" = "arm64"
      - name: Install Arrow, aws-sdk-cpp, openssl@4 (Homebrew)
        run: bash scripts/install_arrow.sh
      - name: Cache DuckDB deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .deps
            ~/.duckdb
          key: duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-jwtcli11cppcodec-brewaws-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch DuckDB and C++ headers
        run: bash scripts/fetch_deps.sh
      - name: Build (AppleClang; omit -DCMAKE_CXX_COMPILER=g++)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          JOBS="$(sysctl -n hw.ncpu)"
          cmake --build build --parallel "$JOBS" --target duckbox duckbox_unit_tests duckbox_guardrail_tests duckbox_integration_tests duckbox_schema_tests duckbox_s3_credentials_tests duckbox_s3_secret_guardrail_tests duckbox_s3_sts_tests
      - name: pyarrow (arm64 Flight SQL metadata alignment)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r examples/python/requirements.txt
      - name: Unit, guardrail, and integration tests
        env:
          DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
          DUCKBOX_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: ctest --test-dir build -L 'unit|guardrails|integration' --exclude-regex '^schema$' --output-on-failure
      # Direct ctest: lldb changes the process memory layout, so a pass
      # under the debugger is not enough on its own.
      - name: Schema tests (ctest)
        env:
          DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
          DUCKBOX_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: ctest --test-dir build -R '^schema$' --output-on-failure
      - name: Schema tests (lldb backtrace on crash)
        env:
          DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
          DUCKBOX_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: bash scripts/ci_macos_schema_loop.sh 1
      - name: Upload schema lldb log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-schema-lldb-${{ github.sha }}
          path: schema-lldb-logs/
          if-no-files-found: ignore

  coverage:
    name: Line coverage (gcovr)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Arrow Flight SQL + build tools
        run: bash scripts/install_arrow.sh
      - name: Cache DuckDB deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .deps
            ~/.duckdb
          key: duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-sts-id-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
            duckdb-v2.0.0-nanoarrow-yamlcpp080-nlohmann3113-awssdk-s3-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
            duckdb-v2.0.0-nanoarrow-yamlcpp080-nlohmann3113-awssdk-s3-${{ runner.os }}-${{ runner.arch }}
      - name: Install AWS SDK C++ (S3+STS, vcpkg)
        run: bash scripts/install_aws_sdk.sh
      - name: ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          create-symlink: true
          max-size: 500M
      - name: Coverage (gcovr, server/src >= 75%)
        run: make coverage

  readme-runbook:
    name: README local runbook (compose, CLI, quickstart)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Arrow Flight SQL + build tools
        run: bash scripts/install_arrow.sh
      - name: Cache DuckDB deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .deps
            ~/.duckdb
          key: duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-sts-id-jwtcli11cppcodec-ducklake-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-jwtcli11cppcodec-ducklake-${{ runner.os }}-${{ runner.arch }}
            duckdb-v2.0.0-nanoarrow-yamlcpp080-nlohmann3113-awssdk-s3-jwtcli11cppcodec-ducklake-${{ runner.os }}-${{ runner.arch }}
            duckdb-v2.0.0-nanoarrow-yamlcpp080-nlohmann3113-awssdk-s3-ducklake-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch deps and build
        run: |
          bash scripts/fetch_deps.sh
          bash scripts/install_aws_sdk.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build build --parallel
      - name: Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r examples/python/requirements.txt
      - name: Tests (README step 3)
        env:
          DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
          DUCKBOX_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          ctest --test-dir build --output-on-failure
          make validate
      - name: Start Postgres + RustFS
        run: docker compose up -d --wait
      - name: Temporary-credential suite against RustFS
        env:
          DUCKBOX_S3_ENDPOINT: 127.0.0.1:9000
          DUCKBOX_S3_KEY: rustfsadmin
          DUCKBOX_S3_SECRET: rustfsadmin
          DUCKBOX_OIDC_ENDPOINT: 127.0.0.1:18088
        run: ./build/duckbox_s3_sts_tests
      - name: Seed DuckLake
        env:
          DUCKBOX_S3_KEY: rustfsadmin
          DUCKBOX_S3_SECRET: rustfsadmin
          DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
          DUCKBOX_LAKE_CATALOG: ducklake:postgres:dbname=ducklake host=127.0.0.1 port=5432 user=duckbox password=duckbox
        run: .venv/bin/python scripts/seed_ducklake.py
      - name: Serve, CLI sandbox create, quickstart, scrape /metrics
        env:
          DUCKBOX_S3_KEY: rustfsadmin
          DUCKBOX_S3_SECRET: rustfsadmin
          DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
          DUCKBOX_LAKE_CATALOG: ducklake:postgres:dbname=ducklake host=127.0.0.1 port=5432 user=duckbox password=duckbox
        run: |
          ./build/duckbox serve --daemon ./daemons/ducklake.yaml --listen 127.0.0.1:4747 \
            > /tmp/duckbox-serve.log 2>&1 &
          echo $! > /tmp/duckbox.pid
          for i in $(seq 1 30); do
            if .venv/bin/python -c "import socket; s=socket.create_connection(('127.0.0.1',4747),1)"; then
              break
            fi
            sleep 1
          done
          ./build/duckbox sandbox create --url grpc://127.0.0.1:4747 \
            --spec ./policies/ducklake/analyst.yaml \
            --id acme-analyst --key tenant_21:user_sergio
          DUCKBOX_URL=grpc://127.0.0.1:4747 DUCKBOX_SANDBOX=acme-analyst \
            DUCKBOX_KEY=tenant_21:user_sergio DUCKBOX_CALLER=local \
            .venv/bin/python test/schema/flight_metadata_pyarrow.py
          .venv/bin/python examples/python/quickstart.py
          curl -sf http://127.0.0.1:9477/metrics > /tmp/duckbox-metrics.txt
          grep -q 'duckbox_query_duration_seconds' /tmp/duckbox-metrics.txt
          grep -q 'duckbox_queries_active' /tmp/duckbox-metrics.txt
          grep -q 'duckbox_sandboxes_resident' /tmp/duckbox-metrics.txt
          grep -q 'policy="analyst"' /tmp/duckbox-metrics.txt
          if grep -E 'tenant="|user="|{key="|,key="|sandbox="' /tmp/duckbox-metrics.txt; then
            echo "metrics must not label tenant/user/key/sandbox id" >&2
            exit 1
          fi
          DUCKBOX_BIN=./build/duckbox DUCKBOX_PYTHON=.venv/bin/python \
            DUCKBOX_SERVE_LOG=/tmp/duckbox-serve.log \
            bash scripts/e2e_catalog_down.sh
          kill "$(cat /tmp/duckbox.pid)" || true
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop compose
        if: always()
        run: docker compose down -v

  multi-node:
    name: Multi-node e2e (RustFS, 3 daemons)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CC: gcc
      CXX: g++
      DUCKBOX_HANDLE_SECRET: duckbox-dev-secret
      DUCKBOX_S3_KEY: rustfsadmin
      DUCKBOX_S3_SECRET: rustfsadmin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Arrow Flight SQL + build tools
        run: bash scripts/install_arrow.sh
      - name: Cache DuckDB deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .deps
            ~/.duckdb
          key: duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-sts-id-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            duckdb-v2.0.0-nanoarrow-yamlcpp090-nlohmann3113-awssdk-s3-jwtcli11cppcodec-${{ runner.os }}-${{ runner.arch }}
      - name: Fetch deps and build
        run: |
          bash scripts/fetch_deps.sh
          bash scripts/install_aws_sdk.sh
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build build --parallel
      - name: Start RustFS
        run: docker compose up -d --wait rustfs
      - name: Python deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r examples/python/requirements.txt
      - name: Multi-node failover e2e
        timeout-minutes: 8
        run: DUCKBOX_PYTHON=.venv/bin/python bash scripts/e2e_multi_node.sh
      - name: SIGINT/SIGTERM exit and deregister
        timeout-minutes: 5
        run: DUCKBOX_PYTHON=.venv/bin/python bash scripts/e2e_signal_shutdown.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop compose
        if: always()
        run: docker compose down -v
