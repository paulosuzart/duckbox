name: analyst
auth:
  mode: trusted
resources:
  memory_limit: 256MB
  threads: 2
  query_timeout_ms: 8000
  max_result_rows: 1000
lake:
  kind: ducklake
  alias: lake
  catalog: "ducklake:postgres:dbname=ducklake host=127.0.0.1 port=5432 user=duckbox password=duckbox"
  data_path: "s3://duckbox-lake/data/"
  read_only: true
  s3:
    endpoint: "127.0.0.1:9000"
    url_style: path
    use_ssl: false
    access_key: rustfsadmin
    secret_key: rustfsadmin
    region: us-east-1
tables:
  deals:
    tenant_column: tenant_id
    columns:
      - tenant_id
      - id
      - title
      - amount
      - _deleted
    filters:
      - "tenant_id = :tenant_id"
      - "_deleted = false"
functions:
  - count
  - count_star
  - sum
  - avg
  - min
  - max
  - lower
  - upper
  - length
  - coalesce
  - round
  - abs
deny_table_functions: true
