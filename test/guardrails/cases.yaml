# Table-driven SQL guardrails. Add a bypass as a new case; no C++ required.
# expect: allow | deny
# stage: rewrite | execute | both | spec
#   deny defaults to rewrite, allow to execute
cases:
  - id: insert_denied
    sql: "INSERT INTO deals VALUES (21, 9, 'x', 1, false)"
    expect: deny
    reason: only SELECT

  - id: multi_statement
    sql: "SELECT 1; SELECT 2"
    expect: deny
    reason: single statement

  - id: secrets_unqualified
    sql: "SELECT * FROM secrets"
    expect: deny
    reason: not allowlisted

  - id: secrets_main
    sql: "SELECT * FROM main.secrets"
    expect: deny
    reason: not allowlisted

  - id: read_csv_auto
    sql: "SELECT * FROM read_csv_auto('x.csv')"
    expect: deny
    reason: table functions

  - id: replacement_scan_s3
    sql: "SELECT * FROM 's3://duckbox-lake/data/secret.parquet'"
    expect: deny
    reason: replacement scans
    stage: both

  - id: replacement_scan_parquet_file
    sql: "SELECT * FROM 'secret.parquet'"
    expect: deny
    reason: replacement scans

  - id: ducklake_inlined_data
    sql: "SELECT * FROM ducklake_inlined_data_deals"
    expect: deny
    reason: not allowlisted
    stage: both

  - id: ducklake_inlined_delete
    sql: "SELECT * FROM ducklake_inlined_delete_deals"
    expect: deny
    reason: not allowlisted
    stage: both

  - id: ducklake_metadata_table
    sql: "SELECT * FROM ducklake_metadata"
    expect: deny
    reason: not allowlisted
    stage: both

  - id: parquet_scan
    sql: "SELECT * FROM parquet_scan('x.parquet')"
    expect: deny
    reason: table functions

  - id: postgres_scan
    sql: "SELECT * FROM postgres_scan('dbname=x', 'public', 'deals')"
    expect: deny
    reason: table functions

  - id: postgres_scan_pushdown
    sql: "SELECT * FROM postgres_scan_pushdown('dbname=x', 'public', 'deals')"
    expect: deny
    reason: table functions
    stage: both

  - id: postgres_query
    sql: "SELECT * FROM postgres_query('SELECT 1')"
    expect: deny
    reason: table functions
    stage: both

  - id: postgres_query_ducklake_inlined
    sql: "SELECT * FROM postgres_query('__ducklake_metadata_lake', 'SELECT * FROM ducklake_inlined_data_1_1')"
    expect: deny
    reason: table functions
    stage: both

  - id: rewrite_query
    sql: "SELECT * FROM query('SELECT 1')"
    expect: deny
    reason: table functions

  - id: rewrite_query_table
    sql: "SELECT * FROM query_table('SELECT 1')"
    expect: deny
    reason: table functions

  - id: rewrite_glob
    sql: "SELECT * FROM glob('*')"
    expect: deny
    reason: table functions

  - id: rewrite_read_csv
    sql: "SELECT * FROM read_csv('x.csv')"
    expect: deny
    reason: table functions

  - id: spec_deny_table_functions_false
    sql: "SELECT 1"
    expect: deny
    reason: always denied
    stage: spec
    deny_table_functions: false

  - id: spec_postgres_query_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: never allowlisted
    stage: spec
    extra_functions:
      - postgres_query

  - id: spec_duckdb_tables_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: never allowlisted
    stage: spec
    extra_functions:
      - duckdb_tables

  - id: agent_create_view
    sql: "CREATE TEMP VIEW x AS SELECT 1 AS x"
    expect: deny
    reason: only SELECT

  - id: agent_range_denied
    sql: "SELECT * FROM range(1, 4)"
    expect: deny
    reason: table functions

  - id: unknown_view
    sql: "SELECT * FROM qv"
    expect: deny
    reason: not allowlisted

  - id: unknown_lake_view
    sql: "SELECT * FROM deal_summaries"
    expect: deny
    reason: not allowlisted
    stage: both

  - id: lake_view_allowlisted
    sql: "SELECT id, title, amount FROM deal_summaries ORDER BY id"
    expect: allow
    stage: execute
    extra_tables:
      - name: deal_summaries
        columns: [tenant_id, id, title, amount]
        filters: ["tenant_id = :tenant_id"]
    contains:
      - alpha deal
    not_contains:
      - bravo
      - alpha deleted

  - id: spec_rejects_init_sql
    sql: "SELECT 1"
    expect: deny
    reason: unknown key
    stage: spec
    spec_yaml: |
      id: mini
      key: tenant_21:user_sergio
      name: analyst
      policy_class: analyst
      auth:
        key:
          patterns:
            - "tenant_{tenant_id}:{user}"
      tables:
        deals:
          columns: [tenant_id, id]
          filters: ["tenant_id = :tenant_id"]
      functions: [count]
      init_sql: SELECT 1

  - id: spec_rejects_authorized_view
    sql: "SELECT 1"
    expect: deny
    reason: unknown key
    stage: spec
    spec_yaml: |
      id: mini
      key: tenant_21:user_sergio
      name: analyst
      policy_class: analyst
      auth:
        key:
          patterns:
            - "tenant_{tenant_id}:{user}"
      tables:
        deals:
          authorized_view: true
          columns: [id]
          filters: ["tenant_id = :tenant_id"]
      functions: [count]

  - id: duckdb_tables
    sql: "SELECT * FROM duckdb_tables()"
    expect: deny
    reason: table functions

  - id: duckdb_secrets
    sql: "SELECT * FROM duckdb_secrets()"
    expect: deny
    reason: table functions

  - id: read_proc_environ
    sql: "SELECT * FROM read_text('/proc/self/environ')"
    expect: deny
    reason: table functions

  - id: read_aws_credentials
    sql: "SELECT * FROM read_text('/root/.aws/credentials')"
    expect: deny
    reason: table functions

  - id: read_web_identity_token
    sql: "SELECT * FROM read_text('/var/run/secrets/eks.amazonaws.com/serviceaccount/token')"
    expect: deny
    reason: table functions

  - id: create_persistent_secret
    sql: "CREATE PERSISTENT SECRET sneak (TYPE s3, KEY_ID 'x', SECRET 'y')"
    expect: deny

  - id: set_s3_access_key
    sql: "SET s3_access_key_id='stolen'"
    expect: deny
    reason: secret-related setting is denied

  - id: set_s3_secret_key
    sql: "SET s3_secret_access_key='stolen'"
    expect: deny
    reason: secret-related setting is denied

  - id: set_s3_session_token
    sql: "SET s3_session_token='stolen'"
    expect: deny
    reason: secret-related setting is denied

  - id: copy_out
    sql: "COPY deals TO 'out.csv'"
    expect: deny
    reason: only SELECT

  - id: pragma_show_tables
    sql: "PRAGMA show_tables"
    expect: deny
    reason: only SELECT

  - id: md5_not_allowlisted
    sql: "SELECT md5(title) FROM deals"
    expect: deny
    reason: function not allowlisted

  - id: window_not_allowlisted
    sql: "SELECT row_number() OVER (ORDER BY id) FROM deals"
    expect: deny
    reason: window function not allowlisted

  - id: spec_window_functions_allowlisted
    sql: "SELECT 1"
    expect: allow
    stage: spec
    extra_functions:
      - row_number
      - rank
      - dense_rank
      - ntile
      - percent_rank
      - cume_dist

  - id: window_row_number_allowlisted
    sql: "SELECT row_number() OVER (ORDER BY id) FROM deals"
    expect: allow
    extra_functions:
      - row_number
      - rank
      - dense_rank
      - ntile
      - percent_rank
      - cume_dist

  - id: qualify_row_number_allowlisted
    sql: "SELECT id FROM deals QUALIFY row_number() OVER (ORDER BY id) = 1"
    expect: allow
    extra_functions:
      - row_number
      - rank

  - id: attach_user_sql
    sql: "ATTACH 'foo.db' AS x"
    expect: deny
    reason: only SELECT

  - id: install_httpfs
    sql: "INSTALL httpfs"
    expect: deny
    reason: extension loading is denied

  - id: union_secrets
    sql: "SELECT id FROM deals UNION SELECT 1 FROM secrets"
    expect: deny
    reason: not allowlisted

  - id: exists_secrets
    sql: "SELECT 1 WHERE EXISTS (SELECT * FROM secrets)"
    expect: deny
    reason: not allowlisted

  - id: star_projects_allowlist
    sql: "SELECT * FROM deals"
    expect: allow
    stage: execute
    not_contains:
      - note
      - should never be visible

  - id: c1_cte_shadow_qualified_secrets
    sql: "WITH secrets AS (SELECT 1) SELECT * FROM memory.main.secrets"
    expect: deny
    reason: not allowlisted
    stage: both

  - id: select_deals_rewrite
    sql: "SELECT id, title, amount FROM deals"
    expect: allow
    stage: rewrite
    rewrite_contains:
      - tenant_id
      - "21"
      - _deleted

  - id: cte_tenant_filter
    sql: "WITH d AS (SELECT id, amount FROM deals) SELECT sum(amount) FROM d"
    expect: allow
    stage: rewrite
    rewrite_contains:
      - "21"

  - id: mandatory_filter_or_true
    sql: "SELECT * FROM deals WHERE tenant_id = 22 OR 1=1"
    expect: allow
    stage: rewrite
    rewrite_contains:
      - "21"

  - id: user_question_param
    sql: "SELECT id FROM deals WHERE id = ?"
    expect: allow
    stage: rewrite
    rewrite_contains:
      - "21"

  - id: limit_capped
    sql: "SELECT id FROM deals LIMIT 99999"
    expect: allow
    stage: rewrite
    rewrite_contains:
      - "100"

  - id: c3_values_subquery_rewrite
    sql: "SELECT * FROM (VALUES ((SELECT max(title) FROM deals WHERE tenant_id = 22))) t(x)"
    expect: allow
    stage: rewrite
    rewrite_contains:
      - "21"

  - id: literal_question_mark
    sql: "SELECT id FROM deals WHERE title = '?'"
    expect: allow
    stage: rewrite

  - id: literal_colon_name
    sql: "SELECT id FROM deals WHERE title = ':tenant_id'"
    expect: allow
    stage: rewrite

  - id: execute_tenant_21
    sql: "SELECT id, title, amount FROM deals ORDER BY id"
    expect: allow
    stage: execute
    contains:
      - alpha deal
    not_contains:
      - bravo
      - alpha deleted

  - id: execute_tenant_22
    sql: "SELECT id, title, amount FROM deals ORDER BY id"
    expect: allow
    stage: execute
    key: tenant_22:user_kim
    contains:
      - bravo deal
    not_contains:
      - alpha deal

  - id: execute_bypass_tenant_predicate
    sql: "SELECT id, title FROM deals WHERE tenant_id = 22"
    expect: allow
    stage: execute
    not_contains:
      - bravo

  - id: execute_cte_aggregate
    sql: "WITH d AS (SELECT amount FROM deals) SELECT sum(amount) AS total FROM d"
    expect: allow
    stage: execute
    contains:
      - "100"

  - id: execute_copy_rewritten
    sql: "COPY deals TO '/tmp/x.csv'"
    expect: deny
    reason: only SELECT
    stage: execute

  - id: execute_secrets
    sql: "SELECT * FROM secrets"
    expect: deny
    reason: allowlisted
    stage: execute

  - id: execute_read_parquet
    sql: "SELECT * FROM read_parquet('x.parquet')"
    expect: deny
    reason: table functions
    stage: execute

  - id: c1_execute_qualified_deals_hides_deleted
    sql: "WITH deals AS (SELECT 1) SELECT * FROM main.deals WHERE tenant_id=21"
    expect: allow
    stage: execute
    not_contains:
      - alpha deleted
      - note

  - id: c2_tenant_typed_equality
    sql: "WITH deals AS (SELECT 1) SELECT * FROM main.deals WHERE tenant_id = 22"
    expect: allow
    stage: execute
    key: tenant_2:mallory
    not_contains:
      - bravo

  - id: c3_values_subquery_execute
    sql: "SELECT * FROM (VALUES ((SELECT max(title) FROM deals WHERE tenant_id = 22))) t(x)"
    expect: allow
    stage: execute
    not_contains:
      - bravo two

  - id: union_deals_self
    sql: "SELECT id FROM deals UNION SELECT id FROM deals"
    expect: allow
    stage: execute
    not_contains:
      - bravo

  - id: staging_deals_not_allowlisted
    sql: "SELECT * FROM staging.deals"
    expect: deny
    reason: not allowlisted
    stage: both

  - id: other_catalog_deals_not_allowlisted
    sql: "SELECT * FROM other.main.deals"
    expect: deny
    reason: not allowlisted

  - id: spec_string_agg_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: "macro is not allowlisted: string_agg"
    stage: spec
    extra_functions:
      - string_agg

  - id: spec_concat_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: "macro is not allowlisted: concat"
    stage: spec
    extra_functions:
      - concat

  - id: spec_read_csv_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: never allowlisted
    stage: spec
    extra_functions:
      - read_csv

  - id: spec_pg_get_viewdef_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: "macro is not allowlisted: pg_get_viewdef"
    stage: spec
    extra_functions:
      - pg_get_viewdef

  - id: spec_format_type_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: "macro is not allowlisted: format_type"
    stage: spec
    extra_functions:
      - format_type

  - id: spec_pg_get_constraintdef_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: "macro is not allowlisted: pg_get_constraintdef"
    stage: spec
    extra_functions:
      - pg_get_constraintdef

  - id: spec_get_block_size_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: "macro is not allowlisted: get_block_size"
    stage: spec
    extra_functions:
      - get_block_size

  - id: parenthesized_setop_with
    sql: "(WITH d AS (SELECT id, title FROM deals) SELECT id, title FROM d) UNION (WITH e AS (SELECT id, title FROM deals) SELECT id, title FROM e)"
    expect: allow
    stage: both
    rewrite_contains:
      - "21"
      - tenant_id
    not_contains:
      - bravo

  - id: connect_quack_uri
    sql: "CONNECT 'quack:localhost'"
    expect: deny
    reason: CONNECT is denied
    stage: both

  - id: disconnect_denied
    sql: "DISCONNECT"
    expect: deny
    reason: CONNECT is denied
    stage: both

  - id: create_trigger_denied
    sql: "CREATE TRIGGER trg_log AFTER INSERT ON deals FOR EACH ROW INSERT INTO secrets VALUES (NEW.tenant_id, 'x')"
    expect: deny
    reason: triggers are denied
    stage: both

  - id: drop_trigger_denied
    sql: "DROP TRIGGER trg_log ON deals"
    expect: deny
    reason: triggers are denied
    stage: both

  - id: quack_serve_call
    sql: "CALL quack_serve(token = 'x')"
    expect: deny
    reason: Quack is denied
    stage: both

  - id: quack_query_table
    sql: "SELECT * FROM quack_query('quack:localhost', 'SELECT 1')"
    expect: deny
    reason: table functions
    stage: both

  - id: install_extension_denied
    sql: "INSTALL quack"
    expect: deny
    reason: extension loading is denied
    stage: both

  - id: load_extension_denied
    sql: "LOAD quack"
    expect: deny
    reason: extension loading is denied
    stage: both

  - id: create_extension_repository
    sql: "CREATE EXTENSION REPOSITORY my_repo WITH PREFIX 'https://extensions.example.org'"
    expect: deny
    reason: extension loading is denied
    stage: both

  - id: create_external_resource
    sql: "CREATE EXTERNAL RESOURCE 'fs' AS extr"
    expect: deny
    reason: external resources are denied
    stage: both

  - id: set_agent_mode
    sql: "SET agent_mode=true"
    expect: deny
    reason: agent mode is denied
    stage: both

  - id: pragma_user_agent
    sql: "PRAGMA user_agent"
    expect: deny
    reason: user_agent is denied
    stage: both

  - id: set_custom_user_agent
    sql: "SET custom_user_agent='x'"
    expect: deny
    reason: user_agent is denied
    stage: both

  - id: select_user_agent_alias
    sql: "SELECT title AS user_agent FROM deals"
    expect: allow
    stage: both

  - id: spec_quack_query_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: never allowlisted
    stage: spec
    extra_functions:
      - quack_query

  - id: spec_parquet_metadata_in_functions
    sql: "SELECT 1"
    expect: deny
    reason: never allowlisted
    stage: spec
    extra_functions:
      - parquet_metadata

  # DuckDB 2.0 lambda syntax. New (Python-style) is accepted; old single-arrow
  # is denied. list_transform is rewrite-only here — warmup still rejects it as
  # a non-exception catalog function (1.5.6 contract).
  - id: lambda_new_syntax_literal
    sql: "SELECT list_transform([1, 2, 3], lambda x : x + 1)"
    expect: allow
    stage: rewrite
    extra_functions:
      - list_transform
      - list_value

  - id: lambda_new_syntax_tenant_wrap
    sql: "SELECT list_transform([amount], lambda x : x + 1) FROM deals"
    expect: allow
    stage: rewrite
    extra_functions:
      - list_transform
      - list_value
    rewrite_contains:
      - "21"
      - tenant_id

  - id: lambda_new_syntax_columns
    sql: "SELECT COLUMNS(lambda c : c = 'id' OR c = 'title' OR c = 'amount') FROM deals"
    expect: allow
    stage: rewrite
    extra_functions:
      - list_filter
    rewrite_contains:
      - "21"
      - tenant_id

  - id: lambda_new_syntax_body_denied
    sql: "SELECT list_transform(['A'], lambda x : md5(x)) FROM deals"
    expect: deny
    reason: function not allowlisted
    extra_functions:
      - list_transform
      - list_value

  - id: lambda_old_syntax_literal
    sql: "SELECT list_transform([1, 2, 3], x -> x + 1)"
    expect: deny
    reason: single-arrow lambda syntax is denied
    extra_functions:
      - list_transform
      - list_value

  - id: lambda_old_syntax_table
    sql: "SELECT list_transform([amount], x -> x + 1) FROM deals"
    expect: deny
    reason: single-arrow lambda syntax is denied
    extra_functions:
      - list_transform
      - list_value

  - id: lambda_old_syntax_json_arrow
    sql: "SELECT title -> '$.a' FROM deals"
    expect: deny
    reason: single-arrow lambda syntax is denied

  - id: lambda_new_syntax_multi_param
    sql: "SELECT list_reduce([1, 2, 3], lambda x, y : x + y)"
    expect: deny
    reason: multi-parameter lambda is denied
    extra_functions:
      - list_reduce
      - list_value

  - id: set_lambda_syntax_enable
    sql: "SET lambda_syntax='enable_single_arrow'"
    expect: deny
    reason: only SELECT

  - id: set_storage_compatibility_version
    sql: "SET storage_compatibility_version='v1.0.0'"
    expect: deny
    reason: only SELECT

  - id: at_timestamp_current_setting
    sql: "SELECT id FROM deals AT (TIMESTAMP => current_setting('allowed_paths')::VARCHAR)"
    expect: deny
    reason: AT clause must be a constant literal
    stage: rewrite

  - id: at_timestamp_s3_setting
    sql: "SELECT id FROM deals AT (TIMESTAMP => current_setting('s3_secret_access_key'))"
    expect: deny
    reason: AT clause must be a constant literal
    stage: rewrite

  - id: at_version_md5
    sql: "SELECT id FROM deals AT (VERSION => md5('a')::INT)"
    expect: deny
    reason: AT clause must be a constant literal
    stage: rewrite

  - id: at_version_lambda
    sql: "SELECT id FROM deals AT (VERSION => len(list_transform([1], x -> x)))"
    expect: deny
    reason: AT clause must be a constant literal
    stage: rewrite

  - id: at_version_literal
    sql: "SELECT id FROM deals AT (VERSION => 1)"
    expect: allow
    stage: rewrite
