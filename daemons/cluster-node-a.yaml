# Cluster member A. Same lease prefix as B/C; unique name, listen, metrics, advertise.
name: node-a
listen: 127.0.0.1:4747
internal_listen: 127.0.0.1:5747
auth:
  mode: trusted
  allow_insecure_dev: true
  operators:
    - local
  peer_secret_ref: env:DUCKBOX_PEER_SECRET
lake_allow:
  s3_endpoints:
    - "127.0.0.1:9000"
  secret_refs:
    - env:DUCKBOX_S3_KEY
    - env:DUCKBOX_S3_SECRET
    - env:DUCKBOX_LAKE_CATALOG
limits:
  handle_ttl_seconds: 300
  idle_evict_ms: 300000
  idle_timeout: 5m
  max_idle_timeout: 1h
  max_sandboxes: 600
  init_sql_timeout_ms: 8000
handle_secret_env: DUCKBOX_HANDLE_SECRET
metrics:
  listen: 127.0.0.1:9477
  policy_classes:
    - analyst
lease:
  endpoint: "http://127.0.0.1:9000"
  bucket: duckbox-control
  prefix: leases/
  access_key_env: DUCKBOX_S3_KEY
  secret_key_env: DUCKBOX_S3_SECRET
  node_id: node-a
  advertise: grpc://127.0.0.1:5747
  ttl: 5s
  heartbeat: 1s
