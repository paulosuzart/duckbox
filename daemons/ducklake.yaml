name: ducklake-dev
listen: 127.0.0.1:4747
auth:
  mode: trusted
  allow_insecure_dev: true
lake_allow:
  s3_endpoints:
    - "127.0.0.1:9000"
  secret_refs:
    - env:DUCKBOX_S3_KEY
    - env:DUCKBOX_S3_SECRET
    - env:DUCKBOX_LAKE_CATALOG
limits:
  handle_ttl_seconds: 300
  idle_evict_ms: 300000
  max_sandboxes: 600
  init_sql_timeout_ms: 8000
handle_secret: duckbox-dev-secret
metrics:
  listen: 127.0.0.1:9477
  policy_classes:
    - analyst
# Control-plane S3 (leases + named sandbox registry). Same credential; no lake access.
lease:
  endpoint: "http://127.0.0.1:9000"
  bucket: duckbox-control
  prefix: leases/
  access_key_env: DUCKBOX_S3_KEY
  secret_key_env: DUCKBOX_S3_SECRET
