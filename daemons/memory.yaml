# Control plane only: no lake, no table access. Lease S3 is optional.
name: memory-dev
listen: 127.0.0.1:4747
auth:
  mode: trusted
  # Local/dev only. Production must unset this and set auth.bearer_secrets
  # or auth.jwt_secret (min handle_secret length 16).
  allow_insecure_dev: true
limits:
  handle_ttl_seconds: 300
  idle_evict_ms: 300000
  idle_timeout: 5m
  max_idle_timeout: 1h
  max_sandboxes: 600
  init_sql_timeout_ms: 5000
handle_secret: duckbox-dev-secret
metrics:
  listen: 127.0.0.1:9477
  policy_classes:
    - analyst
